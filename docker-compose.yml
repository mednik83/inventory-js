services:
  db:
    image: postgres:17.11-alpine3.23
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    ports:
      - "8010:8010"
    volumes:
      - ./db-data:/app/data
    environment:
      - DB_PATH=/app/data/inventory.sqlite
      - DATABASE_URL=postgres://user:password@db:5432/inventory
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend-react
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
